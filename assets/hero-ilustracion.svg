<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <rect width="400" height="500" fill="none"/>
  <!-- arco colonial -->
  <path d="M60 500 V220 Q60 120 200 120 Q340 120 340 220 V500" fill="none" stroke="#c99a3d" stroke-width="3" opacity="0.85"/>
  <path d="M90 500 V225 Q90 150 200 150 Q310 150 310 225 V500" fill="none" stroke="#c99a3d" stroke-width="1.5" opacity="0.5"/>
  <!-- balcón hierro forjado -->
  <g stroke="#c99a3d" stroke-width="2" fill="none" opacity="0.9">
    <line x1="70" y1="330" x2="330" y2="330"/>
    <line x1="70" y1="330" x2="70" y2="500"/>
    <line x1="330" y1="330" x2="330" y2="500"/>
    <path d="M90 330 Q100 300 110 330 T130 330 T150 330 T170 330 T190 330 T210 330 T230 330 T250 330 T270 330 T290 330 T310 330"/>
    <circle cx="110" cy="330" r="3" fill="#c99a3d"/>
    <circle cx="150" cy="330" r="3" fill="#c99a3d"/>
    <circle cx="190" cy="330" r="3" fill="#c99a3d"/>
    <circle cx="230" cy="330" r="3" fill="#c99a3d"/>
    <circle cx="270" cy="330" r="3" fill="#c99a3d"/>
    <circle cx="310" cy="330" r="3" fill="#c99a3d"/>
  </g>
  <!-- jamón colgando, silueta simple -->
  <g transform="translate(200,175)">
    <path d="M-6 -30 L6 -30 L6 -10 Q28 0 22 30 Q16 55 -2 55 Q-20 55 -22 28 Q-24 0 -6 -10 Z"
          fill="#7a2331" stroke="#c99a3d" stroke-width="2"/>
    <line x1="0" y1="-40" x2="0" y2="-30" stroke="#c99a3d" stroke-width="2"/>
    <circle cx="0" cy="-42" r="3" fill="#c99a3d"/>
  </g>
  <!-- estrellas / textura talavera simplificada -->
  <g fill="#7a2331" opacity="0.55">
    <circle cx="130" cy="440" r="4"/>
    <circle cx="200" cy="460" r="4"/>
    <circle cx="270" cy="440" r="4"/>
  </g>
</svg>
